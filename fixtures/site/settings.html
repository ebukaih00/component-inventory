<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Acme Ops</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrapper">
  <nav class="topnav" data-ci-key="nav-main">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="settings.html">Settings</a>
    <a href="billing.html">Billing</a>
  </nav>
  <main class="page">
    <h1>Settings</h1>
    <div class="tabs" role="tablist" data-ci-key="tabs-account">
      <button class="tab" role="tab" aria-selected="true">Profile</button>
      <button class="tab" role="tab" aria-selected="false">Billing</button>
      <button class="tab" role="tab" aria-selected="false">Team</button>
    </div>
    <form>
      <div class="field"><label for="name">Name</label><input id="name" class="text-input" type="text" value="Ada" data-ci-key="input-text"></div>
      <div class="field"><label for="email">Email</label><input id="email" class="text-input" type="email" value="ada@example.com" data-ci-key="input-text"></div>
      <div class="field"><label for="country">Country</label>
        <select id="country" class="select" data-ci-key="select-country"><option>Nigeria</option><option>United Kingdom</option></select></div>
      <div class="field"><label><input type="checkbox" class="check" data-ci-key="checkbox"> Email me product updates</label></div>
      <div class="field"><label>Notifications <button type="button" class="switch" role="switch" aria-checked="true" data-ci-key="toggle-notifications"><span></span></button></label></div>
      <div class="toolbar">
        <button type="button" class="btn btn-primary" data-ci-key="btn-primary">Save</button>
        <button type="button" class="btn btn-secondary" data-ci-key="btn-secondary">Cancel</button>
        <button type="button" class="ghost ghost-r8" data-ci-key="btn-ghost-r8">Preview</button>
      </div>
    </form>
    <div class="section">
      <button type="button" class="danger-zone-btn" data-ci-key="btn-danger-oneoff">Delete account</button>
    </div>
  </main>
</div>
</body>
</html>
